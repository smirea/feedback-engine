pre-commit:
  jobs:
    # CI and cloud agents don't have the shared command.
    - name: worktree
      run: '[ ! -x "$HOME/bin/agent-t3-worktree" ] || "$HOME/bin/agent-t3-worktree" check --heal'
    - group:
        parallel: true
        jobs:
          # One job: both fixers rewrite the same staged files, and in parallel one would overwrite the other's edit.
          - name: fix
            run: >-
              bunx oxlint --fix --no-error-on-unmatched-pattern {staged_files}
              && bunx oxfmt --no-error-on-unmatched-pattern {staged_files}
            stage_fixed: true
          - name: typecheck
            glob: '*.{js,mjs,mts,ts,tsx,svelte,json,jsonc}'
            run: bun run typecheck
          - name: test
            glob: '*.{js,mjs,mts,ts,tsx}'
            run: bun --no-env-file scripts/test-changed.ts {staged_files}
          # The browser tests reach the package through the example app's dev server, which test-changed's import walk cannot see.
          - name: web
            glob: '{packages/web,examples/todo-svelte}/**'
            run: bun --no-env-file run test:web
          # test-changed follows imports, and the features check reads its table from disk.
          - name: spec
            glob: 'spec/*.md'
            run: bun --no-env-file test spec

pre-push:
  commands:
    test:
      glob: '*.{js,mjs,mts,ts,tsx}'
      run: bun --no-env-file scripts/test-changed.ts {push_files}
