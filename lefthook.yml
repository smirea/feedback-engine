pre-commit:
  jobs:
    # CI and cloud agents don't have the shared command.
    - name: worktree
      run: '[ ! -x "$HOME/bin/agent-t3-worktree" ] || "$HOME/bin/agent-t3-worktree" check --heal'
    - group:
        parallel: true
        jobs:
          - name: fix
            glob: "*.{js,mjs,mts,ts,tsx,jsx,svelte}"
            run: bunx oxlint --fix --no-error-on-unmatched-pattern {staged_files}
            stage_fixed: true
          - name: typecheck
            glob: "*.{js,mjs,mts,ts,tsx,svelte,json,jsonc}"
            run: bun run typecheck
          # The whole suite: logic tests run in-process in milliseconds, so selecting by diff would save little and
          # could miss a test whose input is not an import. Git exports GIT_DIR and GIT_INDEX_FILE to hooks, so a
          # test that runs git in a temp directory would act on this repository unless they are unset first.
          - name: test
            glob: "*.{js,mjs,mts,ts,tsx,svelte,json}"
            run: unset $(git rev-parse --local-env-vars); bun run test
          # `swift test` compiles the package for macOS, so it is also the Swift compile check.
          - name: swift
            glob: "{Package.swift,packages/ios/**/*.swift,spec/fixtures/*}"
            run: unset $(git rev-parse --local-env-vars); swift test
          - name: features
            glob: "spec/features.md"
            run: ./scripts/check-features.ts

pre-push:
  commands:
    # A push to master releases what its changesets name, so a web package change without one is never published.
    # Git sets GIT_DIR for a hook in a worktree, and changesets then reads its paths against the wrong folder.
    changeset:
      run: env -u GIT_DIR bunx changeset status --since=origin/master
