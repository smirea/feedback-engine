name: CI

on:
  pull_request:
  push:
    branches: ["master"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      bun: ${{ steps.changes.outputs.bun }}
      swift: ${{ steps.changes.outputs.swift }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - id: changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          EVENT_NAME: ${{ github.event_name }}
          SCAFFOLD_TYPE: swift
        run: bun .github/scripts/changes.ts

  swift:
    name: ${{ matrix.task }} (Swift)
    needs: changes
    if: ${{ !cancelled() }}
    runs-on: ${{ needs.changes.outputs.swift == 'true' && 'macos-26' || 'ubuntu-latest' }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        task: [checks, tests, build]
    env:
      CI: 'true'
      LEFTHOOK: '0'
    steps:
      - name: Verify change detection
        env:
          CHANGE_RESULT: ${{ needs.changes.result }}
        run: test "$CHANGE_RESULT" = success
      - name: No relevant changes
        if: needs.changes.outputs.swift != 'true'
        run: echo "No Swift changes; ${{ matrix.task }} passed."
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: needs.changes.outputs.swift == 'true'
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        if: needs.changes.outputs.swift == 'true'
        with:
          bun-version-file: .bun-version

      - name: Identify Xcode and Swift toolchain
        if: needs.changes.outputs.swift == 'true'
        id: toolchain
        run: |
          xcodebuild -version
          swift --version
          echo "key=$( { xcodebuild -version; swift --version; } | shasum -a 256 | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: needs.changes.outputs.swift == 'true'
        with:
          path: |
            .build/repositories
            .build/checkouts
            .build/artifacts
          key: ${{ runner.os }}-${{ runner.arch }}-spm-${{ steps.toolchain.outputs.key }}-${{ hashFiles('Package.swift', '**/Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-spm-${{ steps.toolchain.outputs.key }}-
      - name: Run Swift task
        if: needs.changes.outputs.swift == 'true'
        run: bun .github/scripts/swift.ts "${{ matrix.task }}"
