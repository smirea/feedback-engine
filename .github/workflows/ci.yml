name: CI

on:
  pull_request:
  push:
    branches: ['master']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      bun: ${{ steps.changes.outputs.bun }}
      swift: ${{ steps.changes.outputs.swift }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - id: changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          EVENT_NAME: ${{ github.event_name }}
        run: bun .github/scripts/changes.ts

  bun:
    name: ${{ matrix.task }} (Bun)
    needs: changes
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        task: [checks, tests, build]
    env:
      CI: 'true'
      LEFTHOOK: '0'
    steps:
      - name: Verify change detection
        env:
          CHANGE_RESULT: ${{ needs.changes.result }}
        run: test "$CHANGE_RESULT" = success
      - name: No relevant changes
        if: needs.changes.outputs.bun != 'true'
        run: echo "No Bun changes; ${{ matrix.task }} passed."
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: needs.changes.outputs.bun == 'true'
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        if: needs.changes.outputs.bun == 'true'
        with:
          bun-version-file: .bun-version
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: needs.changes.outputs.bun == 'true'
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-${{ runner.arch }}-bun-${{ hashFiles('.bun-version') }}-${{ hashFiles('bun.lock', 'bun.lockb') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-bun-${{ hashFiles('.bun-version') }}-
      - name: Install dependencies
        if: needs.changes.outputs.bun == 'true'
        run: bun install --frozen-lockfile
      - name: Generate environment from tracked defaults
        if: needs.changes.outputs.bun == 'true'
        run: bun run env:generate
      - name: Checks
        if: needs.changes.outputs.bun == 'true' && matrix.task == 'checks'
        run: bun run lint:ci && bun run typecheck
      - name: Tests
        if: needs.changes.outputs.bun == 'true' && matrix.task == 'tests'
        run: bun run test
      - name: Build
        if: needs.changes.outputs.bun == 'true' && matrix.task == 'build'
        run: bun run build
  web:
    name: web (Playwright)
    needs: changes
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: 'true'
      LEFTHOOK: '0'
    steps:
      - name: Verify change detection
        env:
          CHANGE_RESULT: ${{ needs.changes.result }}
        run: test "$CHANGE_RESULT" = success
      - name: No relevant changes
        if: needs.changes.outputs.bun != 'true'
        run: echo "No Bun changes; web passed."
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: needs.changes.outputs.bun == 'true'
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        if: needs.changes.outputs.bun == 'true'
        with:
          bun-version-file: .bun-version
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: needs.changes.outputs.bun == 'true'
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-${{ runner.arch }}-bun-${{ hashFiles('.bun-version') }}-${{ hashFiles('bun.lock', 'bun.lockb') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-bun-${{ hashFiles('.bun-version') }}-
      - name: Install dependencies
        if: needs.changes.outputs.bun == 'true'
        run: bun install --frozen-lockfile
      - name: Generate environment from tracked defaults
        if: needs.changes.outputs.bun == 'true'
        run: bun run env:generate
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: needs.changes.outputs.bun == 'true'
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-${{ runner.arch }}-playwright-${{ hashFiles('bun.lock', 'bun.lockb') }}
      - name: Install browsers
        if: needs.changes.outputs.bun == 'true'
        # The runner's resolver has failed on Ubuntu's mirrors for whole jobs while other hosts resolved. apt then
        # retries every package until the job's time limit. A public resolver stands in, and if that fails too the
        # step stops at once.
        run: |
          if ! getent hosts archive.ubuntu.com security.ubuntu.com; then
            sudo rm -f /etc/resolv.conf
            printf 'nameserver 1.1.1.1\nnameserver 8.8.8.8\n' | sudo tee /etc/resolv.conf
            getent hosts archive.ubuntu.com security.ubuntu.com
          fi
          bunx playwright install --with-deps chromium webkit
      - name: Browser tests
        if: needs.changes.outputs.bun == 'true'
        run: bun run test:web

  swift:
    name: ${{ matrix.task }} (Swift)
    needs: changes
    if: ${{ !cancelled() }}
    runs-on: ${{ needs.changes.outputs.swift == 'true' && 'xcode-27' || 'ubuntu-latest' }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        task: [checks, tests, build]
    env:
      CI: 'true'
      LEFTHOOK: '0'
    steps:
      - name: Verify change detection
        env:
          CHANGE_RESULT: ${{ needs.changes.result }}
        run: test "$CHANGE_RESULT" = success
      - name: No relevant changes
        if: needs.changes.outputs.swift != 'true'
        run: echo "No Swift changes; ${{ matrix.task }} passed."
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: needs.changes.outputs.swift == 'true'
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        if: needs.changes.outputs.swift == 'true'
        with:
          bun-version-file: .bun-version
      - name: Identify Xcode and Swift toolchain
        if: needs.changes.outputs.swift == 'true'
        run: |
          xcodebuild -version
          swift --version
      - name: Run Swift task
        if: needs.changes.outputs.swift == 'true'
        run: bun .github/scripts/swift.ts "${{ matrix.task }}"
